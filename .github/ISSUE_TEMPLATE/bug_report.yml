name: Bug report
description: Report a reproducible problem in this Playify fork
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of Playify was involved?
      options:
        - Playback or voice
        - Queue or autoplay
        - Source or catalog resolution
        - Discord commands or controller
        - TUI or launcher
        - Configuration or persistence
        - Updater or maintenance
        - Unsure
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Exact command
      description: Optional. Include its arguments, but remove tokens, cookies, signed URL queries, and other secrets.
      placeholder: /play query:…

  - type: input
    id: input
    attributes:
      label: Sanitized link or query
      description: Optional. Remove credentials and private/signed query parameters before posting.
      placeholder: https://example.test/path or an ordinary search phrase

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Playify with start.bat or start.sh
        2. …
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: incident
    attributes:
      label: Incident ID
      description: Optional. Copy the short incident ID shown by Discord.

  - type: textarea
    id: logs
    attributes:
      label: Sanitized local log excerpt
      description: Optional. Remove tokens, cookies, credentials, private URLs, and personal data.
      render: text

  - type: input
    id: version
    attributes:
      label: Playify version
      description: Copy the complete version shown by /status or the TUI, including the short Git revision.
      placeholder: 2.1.0 (abc1234)
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows 10/11 x64
        - Linux x86-64
        - Unsupported system
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.14.1
    validations:
      required: true

  - type: checkboxes
    id: latest
    attributes:
      label: Version check
      options:
        - label: I checked whether a newer Playify commit is available.
          required: false
